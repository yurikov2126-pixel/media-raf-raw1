name: Windows Radio Agent EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'radio-agent-v*'
    paths:
      - 'radio-agent/windows/**'
      - '.github/workflows/windows-radio-agent-exe.yml'
  pull_request:
    paths:
      - 'radio-agent/windows/**'
      - '.github/workflows/windows-radio-agent-exe.yml'

permissions:
  contents: write

jobs:
  build-windows-agent:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: radio-agent/windows
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify release version before publishing
        if: startsWith(github.ref, 'refs/tags/radio-agent-v')
        shell: pwsh
        run: |
          $expected = "${{ github.ref_name }}".Replace("radio-agent-v", "")
          $actual = python -c "import ast; p=ast.parse(open('gui.py', encoding='utf-8').read()); print(next(n.value.value for n in p.body if isinstance(n,ast.Assign) and any(isinstance(x,ast.Name) and x.id=='AGENT_VERSION' for x in n.targets)))"
          if ($actual.Trim() -ne $expected) { throw "Release $expected does not match application $actual" }
      - name: Compile and test Windows agent logic
        shell: pwsh
        run: |
          python -m compileall -q .
          python -m unittest discover -p "test_*.py" -v
      - name: Build standalone GUI EXE
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==6.16.0" "pillow>=10,<12"
          python brand_icon.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "MediaRafRaw-RadioAgent" --icon brand.ico --add-data "brand.ico;." --paths . gui.py
          if (!(Test-Path "dist/MediaRafRaw-RadioAgent.exe")) { throw "EXE missing" }
      - name: Archive Windows EXE
        uses: actions/upload-artifact@v5
        with:
          name: MediaRafRaw-RadioAgent-Windows-x64
          path: radio-agent/windows/dist/MediaRafRaw-RadioAgent.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish official versioned GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/radio-agent-v'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = python -c "import ast; p=ast.parse(open('gui.py', encoding='utf-8').read()); print(next(n.value.value for n in p.body if isinstance(n,ast.Assign) and any(isinstance(x,ast.Name) and x.id=='AGENT_VERSION' for x in n.targets)))"
          $version = $version.Trim()
          if ($version -notmatch '^\\d+\\.\\d+\\.\\d+) { throw "Invalid AGENT_VERSION $version" }
          $tag = "radio-agent-v$version"
          if ("${{ github.ref }}".StartsWith("refs/tags/") -and "${{ github.ref_name }}" -ne $tag) {
            throw "Tag does not match AGENT_VERSION"
          }
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists: do not overwrite an existing published version."
            exit 0
          }
          # Reject reuse of an existing (possibly incorrect) version tag.
          gh api "repos/${{ github.repository }}/git/ref/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Tag $tag already exists but has no release. Manual review required." }
          # Create tag on THIS verified main commit, not on an arbitrary branch.
          gh release create $tag "dist/MediaRafRaw-RadioAgent.exe#MediaRafRaw-RadioAgent.exe" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "MEDIA · РАФ · RAW — Radio Agent $version" --notes "Windows Radio Agent $version. VLC required. Relay remains in safe pilot; firmware and hardware safety checks required." --latest
