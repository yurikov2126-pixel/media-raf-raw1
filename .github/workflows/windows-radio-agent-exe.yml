name: Windows Radio Agent EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'radio-agent-v*'
    paths:
      - 'radio-agent/windows/**'
      - '.github/workflows/windows-radio-agent-exe.yml'
  pull_request:
    paths:
      - 'radio-agent/windows/**'
      - '.github/workflows/windows-radio-agent-exe.yml'

permissions:
  contents: write

jobs:
  build-windows-agent:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: radio-agent/windows
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify release version before publishing
        if: startsWith(github.ref, 'refs/tags/radio-agent-v')
        shell: pwsh
        run: |
          python release_version.py --expect-tag "${{ github.ref_name }}"
          if ($LASTEXITCODE -ne 0) { throw "Release version does not match tag" }
      - name: Compile and test Windows agent logic
        shell: pwsh
        run: |
          python -m compileall -q .
          python -m unittest discover -p "test_*.py" -v
      - name: Build standalone GUI EXE
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==6.16.0" "pillow>=10,<12"
          python brand_icon.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "MediaRafRaw-RadioAgent" --icon brand.ico --add-data "brand.ico;." --paths . gui.py
          if (!(Test-Path "dist/MediaRafRaw-RadioAgent.exe")) { throw "EXE missing" }
      - name: Archive Windows EXE
        uses: actions/upload-artifact@v5
        with:
          name: MediaRafRaw-RadioAgent-Windows-x64
          path: radio-agent/windows/dist/MediaRafRaw-RadioAgent.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish official versioned GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/radio-agent-v'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (python release_version.py).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read application version' }
          $tag = "radio-agent-v$version"
          if ("${{ github.ref }}".StartsWith('refs/tags/')) {
            python release_version.py --expect-tag "${{ github.ref_name }}"
            if ($LASTEXITCODE -ne 0) { throw 'Tag and application version mismatch' }
          }
          # Existing published version is immutable; do not overwrite binaries.
          gh release view $tag --repo $env:RELEASE_REPO --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists. Skipping."
            exit 0
          }
          # Never create a release for a reused tag pointing to old code.
          gh api "repos/$env:RELEASE_REPO/git/ref/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Tag $tag exists without a release. Manual verification required."
          }
          gh release create $tag "dist/MediaRafRaw-RadioAgent.exe#MediaRafRaw-RadioAgent.exe" --repo $env:RELEASE_REPO --target $env:RELEASE_SHA --title "MEDIA RAF RAW - Radio Agent $version" --notes "Windows Radio Agent $version. VLC required. Hardware amplifier control must be armed explicitly." --latest
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publishing failed" }
