name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  server:
    name: Server — lint & tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Start local PostgreSQL 16 without Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          sudo pg_ctlcluster 16 main start
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'test';"
          sudo -u postgres createdb -O postgres mediaraf_test
          pg_isready -h localhost -p 5432

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install deps
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations to test DB
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/mediaraf_test

      - name: Tests
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/mediaraf_test
          JWT_SECRET: test-secret-do-not-use-in-prod
          NODE_ENV: test

  client:
    name: Client — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Client tests
        run: npm test

      - name: Build
        run: npm run build