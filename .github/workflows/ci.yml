name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  server:
    name: Server — lint & Prisma schema
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install deps
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Android ALARM event-binding regression tests
        run: node --test tests/mchsAndroidAlarmBinding.test.js tests/mchsAndroidObservationMonitor.test.js tests/mchsAndroidIntentLedger.test.js

      - name: Single-session ALARM Worker transport regressions
        run: node --test tests/mchsVerifiedWorkerTransport.test.js tests/radioMchsTrainingOverlay.test.js tests/mchsTrainingSequence.test.js

      - name: Shared station encoder MCHS priority PCM evidence
        run: node --test tests/mchsWorkerPcmEvidence.test.js tests/mchsStationPrioritySession.test.js tests/mchsProductionReadiness.test.js

      - name: Dormant main-station MCHS PCM executor regression
        run: node --test tests/mchsStationPcmExecutor.test.js tests/mchsStationPrioritySession.test.js tests/mchsWorkerPcmEvidence.test.js

      - name: MCHS production Windows Agent binding and ESP32 history scoping
        run: node --test tests/mchsProductionAgentBinding.test.js tests/mchsMainStationReadiness.test.js tests/mchsEsp32ReportSnapshot.test.js

      - name: MCHS atomic ESP32 telemetry and firmware-agent evidence compatibility
        run: node --test tests/mchsEsp32ReportSnapshot.test.js tests/mchsEsp32FirmwareHistory.test.js tests/mchsMainStationReadiness.test.js

      - name: Correlate ESP32 GPIO13 OFF commands with Windows Agent decisions
        run: node --test tests/mchsEsp32OffCorrelation.test.js tests/mchsEsp32HistoryIntegrity.test.js tests/mchsAgentPowerCorrelation.test.js

      - name: ESP32 firmware history upgrade integrity and dropout summary
        run: node --test tests/mchsEsp32HistoryIntegrity.test.js tests/mchsEsp32FirmwareHistory.test.js

      - name: ESP32 boot-scoped GPIO event history and lost-event regression
        run: node --test tests/mchsEsp32FirmwareHistory.test.js tests/mchsEsp32TransitionEvidence.test.js tests/mchsAgentPowerCorrelation.test.js

      - name: MCHS ESP32 firmware relay counters and boot epoch evidence
        run: node --test tests/mchsEsp32TransitionEvidence.test.js tests/mchsMainStationReadiness.test.js

      - name: Agent power decision correlation and allowlist security
        run: node --test tests/mchsAgentPowerCorrelation.test.js tests/mchsEsp32TransitionEvidence.test.js

      - name: MCHS ESP32 relay intent and watchdog transition evidence
        run: node --test tests/mchsEsp32TransitionEvidence.test.js tests/mchsMainStationReadiness.test.js

      - name: MCHS main station read-only readiness and PA proof boundaries
        run: node --test tests/mchsMainStationReadiness.test.js tests/mchsTransportChainDiagnostics.test.js

      - name: MCHS queued admission and uncertain restart claim recovery
        run: node --test tests/mchsStationQueuedAdmissionRecovery.test.js tests/mchsStationSequentialQueue.test.js tests/mchsStationCommandContract.test.js tests/mchsAndroidStationBridge.test.js

      - name: MCHS sequential Android alarm and all-clear admission
        run: node --test tests/mchsStationSequentialQueue.test.js tests/mchsAndroidStationBridge.test.js tests/mchsStationExecutionReceipts.test.js

      - name: MCHS durable Worker terminal journal across restart
        run: node --test tests/mchsStationDurableJournal.test.js tests/mchsStationTerminalHistory.test.js tests/mchsStationExecutionReceipts.test.js

      - name: MCHS short-lived terminal PCM receipt history
        run: node --test tests/mchsStationTerminalHistory.test.js tests/mchsStationExecutionReceipts.test.js

      - name: MCHS priority Worker internal command transport
        run: node --test tests/mchsStationCommandContract.test.js tests/mchsStationPcmExecutor.test.js tests/mchsStationPrioritySession.test.js

      - name: Windows Agent ALARM completion-report contract tests
        run: node --test tests/mchsAgentPlaybackReport.test.js

      - name: Dual-channel ALARM natural-completion evidence tests
        run: node --test tests/mchsNaturalCompletionEvidence.test.js tests/mchsAgentPlaybackReport.test.js tests/mchsVerifiedWorkerTransport.test.js

      - name: Worker ALARM event journal regression tests
        run: node --test tests/mchsWorkerEventJournal.test.js tests/mchsVerifiedWorkerTransport.test.js tests/radioMchsTrainingOverlay.test.js

      - name: ALARM natural dual-channel lifecycle tests
        run: node --test tests/mchsTwoChannelExecutor.test.js tests/mchsIsolatedEventDispatcher.test.js tests/mchsVerifiedWorkerTransport.test.js

      - name: Post-ALARM station return and two-channel lifecycle tests
        run: node --test tests/mchsStationResumeEvidence.test.js tests/mchsTwoChannelExecutor.test.js tests/mchsNaturalCompletionEvidence.test.js

      - name: Isolated end-to-end ALARM playback and station-return scenarios
        run: node --test tests/mchsIsolatedCycleRehearsal.test.js tests/mchsStationResumeEvidence.test.js tests/mchsTwoChannelExecutor.test.js

      - name: Real-service read-only headphones preflight regressions
        run: node --test tests/mchsLiveAudioPreflight.test.js tests/mchsStationResumeEvidence.test.js

      - name: Isolated Android automatic playback state and replay regressions
        run: node --test tests/mchsIsolatedAndroidAutoFeed.test.js tests/mchsAgentIsolatedReadiness.test.js

      - name: Synthetic isolated Agent danger to all-clear full cycle
        run: node --test tests/mchsSyntheticHeadphonesCycle.test.js tests/mchsIsolatedAndroidAutoFeed.test.js

      - name: Agent capability and synthetic timeout regression
        run: node --test tests/mchsSyntheticHeadphonesCycle.test.js tests/mchsAgentIsolatedReadiness.test.js

      - name: Isolated Android channel and danger/all-clear event admission regression
        run: node --test tests/mchsIsolatedAndroidAutoFeed.test.js tests/mchsSyntheticHeadphonesCycle.test.js

      - name: Prisma generate
        run: npx prisma generate

      - name: Validate Prisma schema (no database)
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://postgres:unused@localhost:5432/unused

  esp32-firmware:
    name: ESP32 — compile GPIO13 controller (no flashing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO toolchain
        run: python -m pip install 'platformio>=6.1,<7'

      - name: Provide compile-only placeholder credentials
        run: cp radio-agent/esp32/include/secrets.example.h radio-agent/esp32/include/secrets.h

      - name: Compile ESP32 firmware without hardware
        run: pio run -d radio-agent/esp32 -e esp32dev

  windows-agent-tests:
    name: Windows Agent — isolated headphone playback
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Headphones natural completion and fault recovery
        working-directory: radio-agent/windows
        run: python -m unittest -v test_mchs_headphones_trial test_mchs_local_handover test_mchs_vlc_handover_pilot test_mchs_central_return_monitor test_mchs_lab_end_evidence test_mchs_two_stage_headphones_pilot test_mchs_integrated_headphones_cycle test_mchs_event_admission test_mchs_event_audio_controller test_mchs_event_observation

      - name: Windows Agent power log sanitization and no-secret forwarding
        working-directory: radio-agent/windows
        run: python -m unittest -v test_mchs_power_evidence

      - name: Isolated Android auto START Windows admission regression
        working-directory: radio-agent/windows
        run: python -m unittest -v test_mchs_isolated_android_auto_command test_mchs_event_admission test_mchs_event_audio_controller

      - name: Windows isolated capability heartbeat regression
        working-directory: radio-agent/windows
        run: python -m unittest -v test_mchs_isolated_readiness test_mchs_isolated_android_auto_command

  client:
    name: Client — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Client tests
        run: npm test

      - name: Build
        run: npm run build