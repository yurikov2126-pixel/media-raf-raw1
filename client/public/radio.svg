<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
    <defs>
        <linearGradient id="radioBg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#16213e"/>
            <stop offset="100%" stop-color="#0a0a15"/>
        </linearGradient>
        <linearGradient id="radioAccent" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ff7b54"/>
            <stop offset="100%" stop-color="#e94560"/>
        </linearGradient>
    </defs>
    <rect width="800" height="400" fill="url(#radioBg)"/>
    <!-- микрофон -->
    <rect x="375" y="120" width="50" height="110" rx="25" fill="none" stroke="url(#radioAccent)" stroke-width="8"/>
    <line x1="365" y1="150" x2="435" y2="150" stroke="url(#radioAccent)" stroke-width="4"/>
    <line x1="365" y1="170" x2="435" y2="170" stroke="url(#radioAccent)" stroke-width="4"/>
    <line x1="365" y1="190" x2="435" y2="190" stroke="url(#radioAccent)" stroke-width="4"/>
    <!-- дуга -->
    <path d="M345 200 Q400 250 455 200" fill="none" stroke="url(#radioAccent)" stroke-width="8" stroke-linecap="round"/>
    <!-- стойка -->
    <line x1="400" y1="230" x2="400" y2="280" stroke="url(#radioAccent)" stroke-width="8" stroke-linecap="round"/>
    <line x1="370" y1="280" x2="430" y2="280" stroke="url(#radioAccent)" stroke-width="8" stroke-linecap="round"/>
    <!-- волны эфира -->
    <path d="M300 100 Q280 140 300 180" fill="none" stroke="#ff7b54" stroke-width="4" opacity="0.6"/>
    <path d="M270 90 Q240 140 270 190" fill="none" stroke="#ff7b54" stroke-width="4" opacity="0.4"/>
    <path d="M500 100 Q520 140 500 180" fill="none" stroke="#ff7b54" stroke-width="4" opacity="0.6"/>
    <path d="M530 90 Q560 140 530 190" fill="none" stroke="#ff7b54" stroke-width="4" opacity="0.4"/>
    <!-- название -->
    <text x="400" y="350" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="bold" letter-spacing="1">РАДИОЭФИР</text>
    <text x="400" y="380" text-anchor="middle" fill="#ff7b54" font-family="Arial, sans-serif" font-size="16" letter-spacing="4">RADIO BROADCAST</text>
</svg>