<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
    <defs>
        <linearGradient id="soundBg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#1a1a2e"/>
            <stop offset="100%" stop-color="#0d0d1a"/>
        </linearGradient>
        <linearGradient id="soundAccent" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#7b2ff7"/>
            <stop offset="50%" stop-color="#e94560"/>
            <stop offset="100%" stop-color="#ff7b54"/>
        </linearGradient>
    </defs>
    <rect width="800" height="400" fill="url(#soundBg)"/>
    <!-- центральная линия -->
    <line x1="150" y1="210" x2="650" y2="210" stroke="#e94560" stroke-width="2" opacity="0.4"/>
    <!-- волновые формы (эквалайзер) -->
    <rect x="180" y="185" width="10" height="50" rx="5" fill="url(#soundAccent)"/>
    <rect x="210" y="155" width="10" height="110" rx="5" fill="url(#soundAccent)"/>
    <rect x="240" y="130" width="10" height="160" rx="5" fill="url(#soundAccent)"/>
    <rect x="270" y="100" width="10" height="220" rx="5" fill="url(#soundAccent)"/>
    <rect x="300" y="70"  width="10" height="280" rx="5" fill="url(#soundAccent)"/>
    <rect x="330" y="110" width="10" height="200" rx="5" fill="url(#soundAccent)"/>
    <rect x="360" y="140" width="10" height="140" rx="5" fill="url(#soundAccent)"/>
    <rect x="390" y="90"  width="10" height="240" rx="5" fill="url(#soundAccent)"/>
    <rect x="420" y="120" width="10" height="180" rx="5" fill="url(#soundAccent)"/>
    <rect x="450" y="150" width="10" height="120" rx="5" fill="url(#soundAccent)"/>
    <rect x="480" y="100" width="10" height="220" rx="5" fill="url(#soundAccent)"/>
    <rect x="510" y="140" width="10" height="140" rx="5" fill="url(#soundAccent)"/>
    <rect x="540" y="170" width="10" height="80"  rx="5" fill="url(#soundAccent)"/>
    <rect x="570" y="130" width="10" height="160" rx="5" fill="url(#soundAccent)"/>
    <rect x="600" y="160" width="10" height="100" rx="5" fill="url(#soundAccent)"/>
    <!-- название -->
    <text x="400" y="350" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="bold" letter-spacing="1">ОСНОВЫ ЗВУКОРЕЖИССУРЫ</text>
    <text x="400" y="380" text-anchor="middle" fill="#7b2ff7" font-family="Arial, sans-serif" font-size="16" letter-spacing="4">SOUND ENGINEERING</text>
</svg>