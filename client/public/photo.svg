<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
    <defs>
        <linearGradient id="photoBg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#1a1a2e"/>
            <stop offset="100%" stop-color="#0f0f1e"/>
        </linearGradient>
        <linearGradient id="photoAccent" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#e94560"/>
            <stop offset="100%" stop-color="#ff7b54"/>
        </linearGradient>
    </defs>
    <rect width="800" height="400" fill="url(#photoBg)"/>
    <!-- камера -->
    <rect x="280" y="150" width="240" height="140" rx="18" fill="none" stroke="url(#photoAccent)" stroke-width="8"/>
    <circle cx="400" cy="220" r="48" fill="none" stroke="url(#photoAccent)" stroke-width="8"/>
    <circle cx="400" cy="220" r="22" fill="url(#photoAccent)"/>
    <rect x="330" y="130" width="60" height="20" rx="6" fill="url(#photoAccent)"/>
    <circle cx="490" cy="170" r="8" fill="url(#photoAccent)"/>
    <!-- блики -->
    <circle cx="385" cy="205" r="6" fill="#fff" opacity="0.6"/>
    <!-- название -->
    <text x="400" y="350" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="bold" letter-spacing="1">ОСНОВЫ ФОТОГРАФИИ</text>
    <text x="400" y="380" text-anchor="middle" fill="#e94560" font-family="Arial, sans-serif" font-size="16" letter-spacing="4">PHOTOGRAPHY BASICS</text>
</svg>