<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MEDIA-RAF-RAW">
    <defs>
        <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7C3AED"/>
            <stop offset="0.5" stop-color="#EC4899"/>
            <stop offset="1" stop-color="#06B6D4"/>
        </linearGradient>
    </defs>

    <!-- сплошной фон без скруглений (для maskable/adaptive) -->
    <rect width="512" height="512" fill="url(#brand)"/>

    <!-- текст: MEDIA-RAF-RAW, разбитый на 3 строки -->
    <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
       font-weight="900"
       font-size="96"
       text-anchor="middle"
       fill="#0B0B12"
       letter-spacing="-3">
        <text x="256" y="204">MEDIA-</text>
        <text x="256" y="312">RAF-</text>
        <text x="256" y="420">RAW</text>
    </g>
</svg>