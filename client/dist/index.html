    <!--
        Установка темы ДО загрузки React — предотвращает мерцание.
        Приоритет: localStorage → системная тема.
        Если в localStorage ничего нет, ставим dark; финальное значение
        может быть переопределено настройкой theme_default, когда
        SettingsProvider загрузит настройки.
    -->
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('mrr_theme');
                var resolved = 'dark';
                if (stored === 'light') {
                    resolved = 'light';
                } else if (stored === 'system') {
                    resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                        ? 'light'
                        : 'dark';
                }
                document.documentElement.setAttribute('data-theme', resolved);
                if (resolved === 'light') {
                    var m = document.querySelector('meta[name="theme-color"]');
                    if (m) m.setAttribute('content', '#f5f5f7');
                }
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    -->

                    radial-gradient(60% 40% at 20% 0%, rgba(124,58,237,.08), transparent 60%),

        }

        body { background-color: transparent; }

        .mrr-splash {

            left: 0;

            min-height: 100vh;
            min-height: 100dvh;
            min-height: 100lvh;
            z-index: 9999;
            display: grid;

            background-color: #08080F;
            background-image:
                    radial-gradient(60% 40% at 20% 0%, rgba(124,58,237,.22), transparent 60%),

                    radial-gradient(50% 40% at 50% 100%, rgba(6,182,212,.16), transparent 60%);
            background-repeat: no-repeat;
            background-size: 100% 100%;
            background-attachment: fixed;
            transition: opacity .35s ease;
            font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
        }
        .mrr-splash--hidden {
            opacity: 0;
            pointer-events: none;
        }
        .mrr-splash__inner { text-align: center; }
        .mrr-splash__logo {
            width: 140px;

            font-size: 11px;
            letter-spacing: .3em;
            text-transform: uppercase;
            color: rgba(255,255,255,.35);
        }
        @keyframes mrr-splash-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }
        @media (prefers-reduced-motion: reduce) {
            .mrr-splash__logo { animation: none; }
        }
    </style>
