<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
    <defs>
        <linearGradient id="videoBg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0f3460"/>
            <stop offset="100%" stop-color="#16213e"/>
        </linearGradient>
        <linearGradient id="videoAccent" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#00d4ff"/>
            <stop offset="100%" stop-color="#e94560"/>
        </linearGradient>
    </defs>
    <rect width="800" height="400" fill="url(#videoBg)"/>
    <!-- кинокамера -->
    <rect x="290" y="150" width="200" height="140" rx="16" fill="none" stroke="url(#videoAccent)" stroke-width="8"/>
    <!-- катушки -->
    <circle cx="340" cy="130" r="26" fill="none" stroke="url(#videoAccent)" stroke-width="6"/>
    <circle cx="440" cy="130" r="26" fill="none" stroke="url(#videoAccent)" stroke-width="6"/>
    <circle cx="340" cy="130" r="8" fill="url(#videoAccent)"/>
    <circle cx="440" cy="130" r="8" fill="url(#videoAccent)"/>
    <!-- объектив -->
    <polygon points="490,190 540,170 540,270 490,250" fill="none" stroke="url(#videoAccent)" stroke-width="8" stroke-linejoin="round"/>
    <!-- play -->
    <polygon points="370,200 370,240 405,220" fill="#e94560"/>
    <!-- название -->
    <text x="400" y="350" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="bold" letter-spacing="1">ВИДЕОПРОДАКШН</text>
    <text x="400" y="380" text-anchor="middle" fill="#00d4ff" font-family="Arial, sans-serif" font-size="16" letter-spacing="4">VIDEO PRODUCTION</text>
</svg>