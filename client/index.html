<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
    <meta name="theme-color" content="#08080F" />
    <meta name="description" content="Платформа студенческого медиацентра MEDIA-RAF-RAW (Radio Политех-FM)" />

    <!-- Иконки -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#7C3AED" />

    <!-- PWA (манифест подставит vite-plugin-pwa) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS мета -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MEDIA-RAF-RAW" />

    <!-- Open Graph (дефолтные значения; конкретные страницы переопределяют через usePageMeta и серверный publicMeta) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MEDIA·RAF·RAW" />
    <meta property="og:title" content="MEDIA·RAF·RAW" />
    <meta property="og:description" content="Платформа студенческого медиацентра · Radio Политех-FM" />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:url" content="https://mediarafraw.ru/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MEDIA·RAF·RAW" />
    <meta name="twitter:description" content="Платформа студенческого медиацентра · Radio Политех-FM" />
    <meta name="twitter:image" content="/icon-512.png" />

    <title>MEDIA-RAF-RAW</title>

    <!--
        Pre-React splash.

        Фон-градиент продублирован на html, body и самом .mrr-splash.
        background-attachment: fixed крепит градиент ко вьюпорту, а не к
        высоте элемента, — если html внезапно окажется короче физического
        экрана (типичная проблема iOS standalone PWA), градиент всё равно
        дорисуется до края.
    -->
    <style>
        html, body { margin: 0; }

        html {
            background-color: #08080F;
            background-image:
                    radial-gradient(60% 40% at 20% 0%, rgba(124,58,237,.22), transparent 60%),
                    radial-gradient(50% 40% at 100% 20%, rgba(236,72,153,.18), transparent 60%),
                    radial-gradient(50% 40% at 50% 100%, rgba(6,182,212,.16), transparent 60%);
            background-repeat: no-repeat;
            background-size: 100% 100%;
            background-attachment: fixed;
            /* 100lvh = large viewport height, максимально возможная высота.
               Именно она в standalone PWA совпадает с физическим экраном. */
            height: 100vh;
            height: 100dvh;
            height: 100lvh;
            min-height: 100lvh;
        }

        body {
            margin: 0;
            background-color: transparent;
            min-height: 100vh;
            min-height: 100lvh;
        }

        .mrr-splash {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            /* На всякий случай: даже если top/bottom не растянут,
               min-height гарантирует полное покрытие. */
            min-height: 100vh;
            min-height: 100dvh;
            min-height: 100lvh;
            z-index: 9999;
            display: grid;
            place-items: center;
            background-color: #08080F;
            background-image:
                    radial-gradient(60% 40% at 20% 0%, rgba(124,58,237,.22), transparent 60%),
                    radial-gradient(50% 40% at 100% 20%, rgba(236,72,153,.18), transparent 60%),
                    radial-gradient(50% 40% at 50% 100%, rgba(6,182,212,.16), transparent 60%);
            background-repeat: no-repeat;
            background-size: 100% 100%;
            background-attachment: fixed;
            transition: opacity .35s ease;
            font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
        }
        .mrr-splash--hidden {
            opacity: 0;
            pointer-events: none;
        }
        .mrr-splash__inner { text-align: center; }
        .mrr-splash__logo {
            width: 140px;
            height: 140px;
            display: block;
            margin: 0 auto;
            filter: drop-shadow(0 0 60px rgba(124,58,237,.45));
            animation: mrr-splash-pulse 1.8s ease-in-out infinite;
        }
        .mrr-splash__hint {
            margin-top: 20px;
            font-size: 11px;
            letter-spacing: .3em;
            text-transform: uppercase;
            color: rgba(255,255,255,.35);
        }
        @keyframes mrr-splash-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }
        @media (prefers-reduced-motion: reduce) {
            .mrr-splash__logo { animation: none; }
        }
    </style>
</head>
<body>
<!-- Inline-сплеш: живёт вне React, удаляется из main.jsx -->
<div id="mrr-splash-inline" class="mrr-splash">
    <div class="mrr-splash__inner">
        <svg
                viewBox="0 0 512 512"
                xmlns="http://www.w3.org/2000/svg"
                class="mrr-splash__logo"
                aria-hidden="true"
        >
            <defs>
                <linearGradient
                        id="mrr-splash-grad-html"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%"
                >
                    <stop offset="0%" stop-color="#8B5CF6"/>
                    <stop offset="45%" stop-color="#EC4899"/>
                    <stop offset="100%" stop-color="#06B6D4"/>
                </linearGradient>
            </defs>
            <rect width="512" height="512" rx="120" fill="url(#mrr-splash-grad-html)"/>
            <text
                    x="256" y="235" text-anchor="middle"
                    font-family="'Space Grotesk', system-ui, sans-serif"
                    font-weight="700" font-size="120" fill="#ffffff" letter-spacing="2"
            >MEDIA</text>
            <text
                    x="256" y="365" text-anchor="middle"
                    font-family="'Space Grotesk', system-ui, sans-serif"
                    font-weight="700" font-size="100" fill="#ffffff" letter-spacing="1"
            >RAF-RAW</text>
        </svg>
        <div class="mrr-splash__hint">Загрузка</div>
    </div>
</div>

<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
