<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
    <meta name="theme-color" content="#08080F" />
    <meta name="description" content="Платформа студенческого медиацентра MEDIA-RAF-RAW (Radio Политех-FM)" />

    <!-- Иконки -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#7C3AED" />

    <!-- PWA (манифест подставит vite-plugin-pwa) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS мета -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MEDIA-RAF-RAW" />

    <title>MEDIA-RAF-RAW</title>

    <!--
        Pre-React splash.
        Рендерится синхронно вместе с HTML, до загрузки JS-бандла —
        закрывает белый экран на медленной сети и при холодном старте PWA.
        Использует те же классы .mrr-splash*, что и React-компонент
        <SplashScreen />, поэтому переход между ними незаметен.
    -->
    <style>
        html, body { background-color: #08080F; margin: 0; }

        .mrr-splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: grid;
            place-items: center;
            background-color: #08080F;
            background-image:
                    radial-gradient(60% 40% at 20% 0%, rgba(124,58,237,.22), transparent 60%),
                    radial-gradient(50% 40% at 100% 20%, rgba(236,72,153,.18), transparent 60%),
                    radial-gradient(50% 40% at 50% 100%, rgba(6,182,212,.16), transparent 60%);
            transition: opacity .35s ease;
            font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
        }
        .mrr-splash--hidden {
            opacity: 0;
            pointer-events: none;
        }
        .mrr-splash__inner { text-align: center; }
        .mrr-splash__orb {
            width: 80px;
            height: 80px;
            margin: 0 auto;
            border-radius: 28px;
            background-image: linear-gradient(135deg, #7C3AED 0%, #EC4899 50%, #06B6D4 100%);
            background-size: 200% 200%;
            box-shadow: 0 0 60px rgba(124,58,237,.5);
            animation: mrr-splash-pulse 1.6s ease-in-out infinite,
            mrr-splash-gradient 4s ease infinite;
        }
        .mrr-splash__title {
            margin-top: 24px;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: .18em;
            color: rgba(255,255,255,.85);
        }
        .mrr-splash__hint {
            margin-top: 8px;
            font-size: 11px;
            letter-spacing: .3em;
            text-transform: uppercase;
            color: rgba(255,255,255,.3);
        }
        @keyframes mrr-splash-pulse {
            0%, 100% { transform: scale(1); opacity: .9; }
            50% { transform: scale(1.08); opacity: 1; }
        }
        @keyframes mrr-splash-gradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        @media (prefers-reduced-motion: reduce) {
            .mrr-splash__orb { animation: none; }
        }
    </style>
</head>
<body>
<!-- Inline-сплеш: живёт вне React, удаляется из main.jsx -->
<div id="mrr-splash-inline" class="mrr-splash">
    <div class="mrr-splash__inner">
        <div class="mrr-splash__orb"></div>
        <div class="mrr-splash__title">MEDIA·RAF·RAW</div>
        <div class="mrr-splash__hint">Загрузка</div>
    </div>
</div>

<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
