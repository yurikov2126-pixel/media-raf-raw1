# MEDIA·RAF·RAW — пример для nginx, обслуживающего React SPA
# Добавьте map внутри блока http {} (НЕ внутрь server {}).
map $http_user_agent $mrr_social_crawler {
    default 0;
    ~*(telegrambot|vkshare|facebookexternalhit|twitterbot|whatsapp|discordbot|slackbot|linkedinbot|pinterest|embedly|skypeuripreview|viber|bot|crawler|spider) 1;
}

# В server {} сайта mediarafraw.ru замените только существующий SPA location /,
# сохранив остальные location для /api/, /uploads/ и статики.
# Используем named location вместо if с proxy_pass.
location / {
    if ($mrr_social_crawler) { return 418; }
    try_files $uri $uri/ /index.html;
    error_page 418 = @mrr_social_preview;
}

location @mrr_social_preview {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header User-Agent $http_user_agent;
    proxy_read_timeout 10s;
}
# !!! 4000 — пример. Подставьте реальный порт backend из конфигурации сервера.
# Применять только после nginx -t; затем systemctl reload nginx.
