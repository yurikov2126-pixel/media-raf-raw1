# Add inside the same mediarafraw.ru server {} as the public MP3 location.
# Exact match ensures agent traffic bypasses the generic /api/ regex.
# Never send Authorization to the playout worker directly.
location = /api/radio-agent/agent/stream {
    proxy_pass http://127.0.0.1:4106;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    gzip off;
}
