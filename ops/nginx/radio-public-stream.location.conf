# Add inside the existing mediarafraw.ru server {} before the generic /api/ regex.
# Exact-match public MP3 only. The authenticated /agent/stream stays on port 4000.
location = /api/radio-agent/listen {
    proxy_pass http://127.0.0.1:4106;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    gzip off;
}
